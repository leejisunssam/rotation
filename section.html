<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회전체 단면 관찰 시뮬레이터</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121216; color: #fff; }
    #ui-panel {
      position: absolute; top: 15px; left: 15px;
      background: rgba(20, 20, 28, 0.88); padding: 18px; border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 280px; z-index: 100;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);
    }
    h2 { margin: 0 0 12px 0; font-size: 1.1rem; color: #FFD60A; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; }
    .control-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #E0E0E0; }
    select, button, input[type=range] { width: 100%; padding: 8px 10px; border-radius: 6px; border: none; font-size: 0.85rem; }
    select { background: #2A2A35; color: white; cursor: pointer; border: 1px solid #444; }
    button { background: #FF9500; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 4px; }
    button:hover { background: #E08200; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .slider-val { font-weight: bold; color: #FFD60A; font-size: 0.85rem; }
    .radio-group { display: flex; gap: 12px; background: #2A2A35; padding: 6px 10px; border-radius: 6px; }
    .radio-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 0.82rem; margin: 0; }
  </style>
  <!-- 안정적인 CDN 호스팅 스크립트 -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="ui-panel">
  <h2>🔪 회전체 단면 관찰기</h2>
  
  <div class="control-group">
    <label for="shapeSelect">회전체 선택</label>
    <select id="shapeSelect">
      <option value="cylinder">직사각형 ➔ 원기둥</option>
      <option value="cone">직각삼각형 ➔ 원뿔</option>
      <option value="sphere">반원 ➔ 구</option>
      <option value="frustum">사다리꼴 ➔ 원뿔대</option>
    </select>
  </div>

  <div class="control-group">
    <label>자르는 방향</label>
    <div class="radio-group">
      <label><input type="radio" name="cutDir" value="horizontal" checked> 가로 (수평)</label>
      <label><input type="radio" name="cutDir" value="vertical"> 세로 (수직)</label>
    </div>
  </div>

  <div class="control-group">
    <div class="slider-header">
      <label style="margin:0;">절단 위치</label>
      <span id="posVal" class="slider-val">0.00</span>
    </div>
    <input type="range" id="posSlider" min="-1.5" max="1.5" step="0.02" value="0.00">
  </div>

  <div class="control-group" style="margin-bottom:0;">
    <button id="resetCam">시점 초기화</button>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    // 1. Scene, Camera, Renderer 초기화
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121216);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4, 3.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.localClippingEnabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 2. 조명 및 축 설정
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(5, 8, 5);
    scene.add(dirLight);

    // 중앙 회전축 (빨간 점선)
    const axisGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, -2.5, 0),
      new THREE.Vector3(0, 2.5, 0)
    ]);
    const axisMat = new THREE.LineDashedMaterial({ color: 0xff3b30, dashSize: 0.1, gapSize: 0.08 });
    const axisLine = new THREE.Line(axisGeo, axisMat);
    axisLine.computeLineDistances();
    scene.add(axisLine);

    // 3. Clipping Plane 및 Mesh 관리
    const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
    let solidMesh = null;
    let outlineMesh = null;

    function buildMesh() {
      if (solidMesh) scene.remove(solidMesh);
      if (outlineMesh) scene.remove(outlineMesh);

      const shapeType = document.getElementById('shapeSelect').value;
      let geometry;

      if (shapeType === 'cylinder') {
        geometry = new THREE.CylinderGeometry(1.2, 1.2, 2.4, 64);
      } else if (shapeType === 'cone') {
        geometry = new THREE.ConeGeometry(1.4, 2.4, 64);
        geometry.translate(0, -0.1, 0);
      } else if (shapeType === 'sphere') {
        geometry = new THREE.SphereGeometry(1.3, 64, 64);
      } else if (shapeType === 'frustum') {
        geometry = new THREE.CylinderGeometry(0.8, 1.5, 2.4, 64);
      }

      // 회전체 메쉬 (절단 적용)
      const material = new THREE.MeshPhongMaterial({
        color: 0x007AFF,
        side: THREE.DoubleSide,
        clippingPlanes: [clipPlane],
        transparent: true,
        opacity: 0.85,
        shininess: 90
      });

      solidMesh = new THREE.Mesh(geometry, material);
      scene.add(solidMesh);

      // 절단면 외곽 강조선 (노란색)
      const wireGeo = new THREE.WireframeGeometry(geometry);
      const wireMat = new THREE.LineBasicMaterial({
        color: 0xFFD60A,
        clippingPlanes: [clipPlane]
      });
      outlineMesh = new THREE.LineSegments(wireGeo, wireMat);
      scene.add(outlineMesh);
    }

    function updateClipPlane() {
      const cutDir = document.querySelector('input[name="cutDir"]:checked').value;
      const pos = parseFloat(document.getElementById('posSlider').value);

      if (cutDir === 'horizontal') {
        clipPlane.normal.set(0, -1, 0);
        clipPlane.constant = pos;
      } else {
        clipPlane.normal.set(-1, 0, 0);
        clipPlane.constant = pos;
      }
    }

    // 4. 이벤트 연결
    document.getElementById('shapeSelect').addEventListener('change', buildMesh);

    document.querySelectorAll('input[name="cutDir"]').forEach(radio => {
      radio.addEventListener('change', () => {
        document.getElementById('posSlider').value = 0;
        document.getElementById('posVal').innerText = '0.00';
        updateClipPlane();
      });
    });

    document.getElementById('posSlider').addEventListener('input', (e) => {
      document.getElementById('posVal').innerText = parseFloat(e.target.value).toFixed(2);
      updateClipPlane();
    });

    document.getElementById('resetCam').addEventListener('click', () => {
      camera.position.set(4, 3.5, 5);
      controls.target.set(0, 0, 0);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 화면 켜지자마자 실행
    buildMesh();
    updateClipPlane();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  });
</script>
</body>
</html>
