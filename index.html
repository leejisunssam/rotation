<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 회전체 만들기 시뮬레이터</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; background-color: #1a1a1a; color: white; }
    #ui-panel {
      position: absolute; top: 15px; left: 15px;
      background: rgba(0, 0, 0, 0.85); padding: 20px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 280px; z-index: 10;
    }
    h2 { margin-top: 0; font-size: 1.2rem; color: #4DA6FF; border-bottom: 1px solid #444; padding-bottom: 8px; }
    .control-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
    select, button, input[type=range] { width: 100%; padding: 8px; border-radius: 6px; border: none; font-size: 0.9rem; }
    select { background: #333; color: white; cursor: pointer; }
    button { background: #0066CC; color: white; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s; }
    button:hover { background: #0052A3; }
    .slider-val { float: right; font-weight: bold; color: #4DA6FF; }
  </style>
  <!-- Three.js 및 OrbitControls CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="ui-panel">
  <h2>🔄 3D 회전체 만들기</h2>
  
  <div class="control-group">
    <label for="shapeSelect">회전시킬 평면도형 선택</label>
    <select id="shapeSelect">
      <option value="rectangle">직사각형 ➔ 원기둥</option>
      <option value="triangle">직각삼각형 ➔ 원뿔</option>
      <option value="semicircle">반원 ➔ 구</option>
      <option value="trapezoid">사다리꼴 ➔ 원뿔대</option>
    </select>
  </div>

  <div class="control-group">
    <label>회전각도 (0° ~ 360°)<span id="angleVal" class="slider-val">360°</span></label>
    <input type="range" id="angleSlider" min="1" max="360" value="360">
  </div>

  <div class="control-group">
    <button id="toggleWire">단면선/와이어프레임 보기</button>
  </div>
</div>

<script>
  // 1. Scene & Renderer 설정
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1e1e24);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(5, 4, 7);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // 2. 조명 및 회전축(Z축/Y축 기준) 표시
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  // 회전축 (빨간선: Y축)
  const axisGeometry = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, -4, 0),
    new THREE.Vector3(0, 4, 0)
  ]);
  const axisMaterial = new THREE.LineBasicMaterial({ color: 0xff4444, linewidth: 3 });
  const axisLine = new THREE.Line(axisGeometry, axisMaterial);
  scene.add(axisLine);

  // 3. 회전체 생성 함수
  let currentMesh = null;
  let wireframeMesh = null;
  let isWire = false;

  function createRevolvedMesh() {
    if (currentMesh) scene.remove(currentMesh);
    if (wireframeMesh) scene.remove(wireframeMesh);

    const shapeType = document.getElementById('shapeSelect').value;
    const angleDeg = parseFloat(document.getElementById('angleSlider').value);
    const angleRad = (angleDeg * Math.PI) / 180;

    const points = [];

    // 도형 프로필 단면 좌표 설정 (Y축 회전)
    if (shapeType === 'rectangle') {
      points.push(new THREE.Vector2(0, -1.5));
      points.push(new THREE.Vector2(1.5, -1.5));
      points.push(new THREE.Vector2(1.5, 1.5));
      points.push(new THREE.Vector2(0, 1.5));
    } else if (shapeType === 'triangle') {
      points.push(new THREE.Vector2(0, -1.5));
      points.push(new THREE.Vector2(1.8, -1.5));
      points.push(new THREE.Vector2(0, 1.5));
    } else if (shapeType === 'semicircle') {
      const radius = 1.5;
      for (let i = 0; i <= 30; i++) {
        const theta = (i / 30) * Math.PI - (Math.PI / 2);
        points.push(new THREE.Vector2(radius * Math.cos(theta), radius * Math.sin(theta)));
      }
    } else if (shapeType === 'trapezoid') {
      points.push(new THREE.Vector2(0, -1.5));
      points.push(new THREE.Vector2(2.0, -1.5));
      points.push(new THREE.Vector2(1.0, 1.5));
      points.push(new THREE.Vector2(0, 1.5));
    }

    const geometry = new THREE.LatheGeometry(points, 48, 0, angleRad);
    
    // 입체 재질 (반투명 파란색)
    const material = new THREE.MeshPhongMaterial({
      color: 0x3388ff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.85,
      shininess: 90
    });

    currentMesh = new THREE.Mesh(geometry, material);
    scene.add(currentMesh);

    // 와이어프레임 생성
    const wireGeometry = new THREE.WireframeGeometry(geometry);
    const wireMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
    wireframeMesh = new THREE.LineSegments(wireGeometry, wireMaterial);
    wireframeMesh.visible = isWire;
    scene.add(wireframeMesh);
  }

  // 4. 이벤트 리스너 설정
  document.getElementById('shapeSelect').addEventListener('change', createRevolvedMesh);
  document.getElementById('angleSlider').addEventListener('input', (e) => {
    document.getElementById('angleVal').innerText = e.target.value + '°';
    createRevolvedMesh();
  });
  document.getElementById('toggleWire').addEventListener('click', () => {
    isWire = !isWire;
    if (wireframeMesh) wireframeMesh.visible = isWire;
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 초기 실행
  createRevolvedMesh();

  // 루프 애니메이션
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
